name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Creates tag v<version>."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.v.outputs.version }} --no-configuration-cache

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          ZIP=$(ls build/distributions/*.zip | head -1)
          gh release create "v$V" "$ZIP" \
            --target "${{ github.sha }}" \
            --title "Mixed Deno Types $V" \
            --notes "Install in WebStorm: Settings | Plugins | ⚙ | Install Plugin from Disk… and pick $(basename "$ZIP")."
