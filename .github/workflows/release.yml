name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Creates tag v<version>."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.v.outputs.version }} --no-configuration-cache

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          ZIP=$(ls build/distributions/*.zip | head -1)
          NAME=$(basename "$ZIP")
          cat > updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.mixeddeno.types"
                    url="https://github.com/${{ github.repository }}/releases/download/v$V/$NAME"
                    version="$V">
              <idea-version since-build="263"/>
              <name>Mixed Deno Types</name>
            </plugin>
          </plugins>
          XML
          sed -i 's/^          //' updatePlugins.xml
          gh release create "v$V" "$ZIP" updatePlugins.xml \
            --target "${{ github.sha }}" \
            --title "Mixed Deno Types $V" \
            --notes "Install in WebStorm: Settings | Plugins | ⚙ | Manage Plugin Repositories, add https://github.com/${{ github.repository }}/releases/latest/download/updatePlugins.xml, then install Mixed Deno Types from the Marketplace tab (updates arrive automatically). Or Install Plugin from Disk with $NAME."
